<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MenMen Workflow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="layout-btn" id="layoutBtn" title="Đổi layout">
        <span class="layout-dot"></span>
        <span id="layoutName">Layout</span>
        <svg class="caret" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" /></svg>
      </button>
      <div class="spacer"></div>
      <button class="icon-btn" id="editBtn" title="Chế độ chỉnh sửa layout">
        <svg viewBox="0 0 16 16"><path d="M11.3 2.3l2.4 2.4-8.2 8.2H3.1v-2.4z" /><path d="M9.8 3.8l2.4 2.4" /></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Cài đặt">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" /></svg>
      </button>
      <button class="icon-btn" id="menuBtn" title="Menu">
        <svg viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h10" /></svg>
      </button>
    </header>
    <main id="gridWrap">
      <div class="grid" id="grid"></div>
    </main>
    <footer class="helptip" id="helptip"></footer>
    <div class="toast" id="toast"></div>
  </div>
  <div id="overlay"></div>

  <script src="js/bridge.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/store.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
