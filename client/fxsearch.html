<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MenMen FX Search</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--surface); padding: 10px; box-sizing: border-box; }
    #fx { height: 100%; display: flex; flex-direction: column; }
    #fx .fxs { flex: 1; min-height: 0; }
    #fx .fxs-list { flex: 1; max-height: none; min-height: 0; }
    #fxstatus { min-height: 16px; padding-top: 4px; }
    #fxstatus.err { color: var(--danger); }
  </style>
</head>
<body>
  <div id="fx"></div>
  <div id="fxstatus" class="muted small"></div>
  <div id="overlay"></div>
  <div id="toast"></div>
  <script src="js/bridge.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/store.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/fxsearch.js"></script>
  <script src="js/fxwindow.js"></script>
</body>
</html>
